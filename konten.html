<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block; }
  </style>
  <title>Dashboard & Layanan - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans pb-32 min-h-screen">

  <!-- Header Atas (Mode Desktop/PC Full Width) -->
  <header class="bg-white px-6 py-4 shadow-sm sticky top-0 z-30 border-b">
    <div class="max-w-6xl mx-auto w-full flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-12 w-12 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-base tracking-wide leading-tight">UPTD FARMASI KOTA TANGERANG SELATAN</h1>
          <p class="text-xs text-gray-600 font-semibold uppercase tracking-wider">Sistem Informasi Pelayanan & Manajemen Arsip</p>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA (Mode Grid Desktop yang Luas & Profesional) -->
  <main id="mainDashboard" class="max-w-6xl mx-auto p-6 space-y-6">
    
    <!-- Bagian Atas: Profil & Aksi Cepat Side-by-Side di PC -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Kartu Profil Pegawai (Kolom Kiri) -->
      <a href="profil.html" class="block bg-white p-6 rounded-2xl shadow-sm border border-gray-100 relative hover:border-blue-300 transition flex flex-col justify-between">
        <div>
          <p class="text-[10px] text-blue-900 font-extrabold uppercase tracking-wide">PROFIL PEGAWAI</p>
          <h2 class="text-base font-extrabold text-gray-800 mt-1">UPTD FARMASI</h2>
          <p class="text-xs text-gray-600 font-mono mt-1">Kota Tangerang Selatan</p>
        </div>
        <div class="h-32 w-full flex items-center justify-center bg-transparent mt-4">
          <img src="https://i.ibb.co.com/jPB3ZPgJ/Picsart-26-07-24-23-07-31-642.png" class="w-28 h-28 object-contain">
        </div>
      </a>

      <!-- Kotak Aksi Cepat (Kolom Kanan - 2x2 Grid) -->
      <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
        <div class="flex items-center gap-2 mb-4 text-gray-700 font-bold text-sm">
          <span class="text-blue-900">⇄</span> Aksi Cepat Layanan
        </div>
        <div class="grid grid-cols-2 gap-4">
          
          <!-- Informasi -->
          <button onclick="bukaDaftar('Informasi')" class="p-4 rounded-xl border border-blue-100 bg-[#f4f8fb] hover:bg-blue-50 transition flex items-center gap-4 text-left">
            <div class="w-12 h-12 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/fzWd1Sq6/Picsart-26-07-24-23-03-05-634.png" class="w-16 h-16 object-contain">
            </div>
            <div>
              <p class="text-sm font-bold text-gray-800">Informasi</p>
              <p class="text-xs text-gray-500">Update Arsip</p>
            </div>
          </button>

          <!-- Edukasi -->
          <button onclick="bukaDaftar('Edukasi')" class="p-4 rounded-xl border border-emerald-100 bg-[#f2faf5] hover:bg-emerald-50 transition flex items-center gap-4 text-left">
            <div class="w-12 h-12 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/SWQXc7m/Picsart-26-07-24-23-05-58-799.png" class="w-16 h-16 object-contain">
            </div>
            <div>
              <p class="text-sm font-bold text-gray-800">Edukasi</p>
              <p class="text-xs text-gray-500">Materi & Panduan</p>
            </div>
          </button>

          <!-- Layanan ASN -->
          <button onclick="bukaDaftar('Pelayanan')" class="p-4 rounded-xl border border-purple-100 bg-[#faf5fb] hover:bg-purple-50 transition flex items-center gap-4 text-left">
            <div class="w-12 h-12 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/N6WBWsJT/Picsart-26-07-24-23-01-12-888.png" class="w-16 h-16 object-contain">
            </div>
            <div>
              <p class="text-sm font-bold text-gray-800">Layanan</p>
              <p class="text-xs text-gray-500">Distribusi Logistik</p>
            </div>
          </button>

          <!-- Kategori Obat -->
          <button onclick="bukaDaftar('Obat')" class="p-4 rounded-xl border border-amber-100 bg-[#fdfaf2] hover:bg-amber-50 transition flex items-center gap-4 text-left">
            <div class="w-12 h-12 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/8QzyGR8/Picsart-26-07-24-23-04-30-680.png" class="w-16 h-16 object-contain">
            </div>
            <div>
              <p class="text-sm font-bold text-gray-800">Kategori Obat</p>
              <p class="text-xs text-gray-500">Data Perbekalan</p>
            </div>
          </button>

        </div>
      </div>

    </div>

    <!-- Galeri Kegiatan UPTD Farmasi (Grid Lebar untuk PC) -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
          <span class="font-extrabold text-blue-900 text-sm tracking-wide">Galeri Kegiatan UPTD Farmasi</span>
        </div>
        <span class="text-xs text-emerald-700 bg-emerald-50 px-3 py-1 rounded-md font-bold">Dokumentasi</span>
      </div>
      <!-- Grid Foto Kegiatan Dinamis (Menampilkan lebih banyak kolom di layar PC) -->
      <div id="gridGaleri" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <div class="col-span-full text-center py-6 text-sm text-gray-400">Memuat galeri...</div>
      </div>
    </div>
  </main>

  <!-- KONTEN DINAMIS -->
  <div id="pageDaftar" class="hidden-custom max-w-6xl mx-auto p-6">
    <button onclick="kembaliKeDashboard()" class="text-blue-900 font-bold mb-4 text-sm inline-flex items-center gap-1">← Kembali ke Dashboard</button>
    <div id="areaDaftar" class="bg-white p-6 rounded-2xl shadow-sm"></div>
  </div>

  <div id="pageBaca" class="hidden-custom max-w-6xl mx-auto p-6">
    <button onclick="kembaliKeDaftar()" class="text-blue-900 font-bold mb-4 text-sm inline-flex items-center gap-1">← Kembali ke Daftar</button>
    <div id="areaBaca" class="bg-white p-8 rounded-2xl shadow-sm"></div>
  </div>

  <!-- MODAL ZOOM GAMBAR GALERI -->
  <div id="modalZoom" class="hidden-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="relative max-w-2xl w-full">
      <button onclick="tutupZoom()" class="absolute -top-12 right-0 text-white font-bold text-base bg-black/60 px-4 py-2 rounded-full hover:bg-black">✕ Tutup</button>
      <img id="gambarZoom" src="" class="w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl bg-white">
    </div>
  </div>

  <!-- Bottom / Floating Navigation Bar untuk Akses Cepat (Fixed di bawah layar secara rapi) -->
  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md border border-emerald-300 shadow-2xl py-3 px-8 rounded-full flex justify-center items-center gap-8 z-40">
    
    <!-- Registrasi -->
    <a href="index.html#registrasi" class="flex items-center gap-2 text-emerald-900 font-bold hover:text-emerald-700 transition">
      <div class="w-6 h-6 flex items-center justify-center">
        <img src="https://i.ibb.co.com/Xf1wsJ41/Picsart-26-07-25-12-29-14-940.png" class="w-full h-full object-contain">
      </div>
      <span class="text-xs font-extrabold tracking-tight">Registrasi</span>
    </a>

    <span class="text-gray-300">|</span>

    <!-- Maps -->
    <a href="kontak.html" class="flex items-center gap-2 text-emerald-900 font-bold hover:text-emerald-700 transition">
      <div class="w-6 h-6 flex items-center justify-center">
        <img src="https://i.ibb.co.com/5PtXnK6/Picsart-26-07-25-12-25-33-560.png" class="w-full h-full object-contain">
      </div>
      <span class="text-xs font-bold tracking-tight">Maps</span>
    </a>
    
    <span class="text-gray-300">|</span>

    <!-- Tamu -->
    <a href="registrasi.html" class="flex items-center gap-2 text-emerald-900 font-bold hover:text-emerald-700 transition">
      <div class="w-6 h-6 flex items-center justify-center">
        <img src="https://i.ibb.co.com/YBSNWNGM/Picsart-26-07-24-23-37-45-946.png" class="w-full h-full object-contain">
      </div>
      <span class="text-xs font-bold tracking-tight">Tamu</span>
    </a>

    <span class="text-gray-300">|</span>

    <!-- Survei -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSexxMw_FdW-XT6yTyiPUVnpFyKf_j01-4lk-JmiQRrT3IC04A/viewform" target="_blank" class="flex items-center gap-2 text-emerald-900 font-bold hover:text-emerald-700 transition">
      <div class="w-6 h-6 flex items-center justify-center">
        <img src="https://i.ibb.co.com/M5D0s0t9/Picsart-26-07-25-11-29-02-111.png" class="w-full h-full object-contain">
      </div>
      <span class="text-xs font-bold tracking-tight">Survei</span>
    </a>
  </nav>

  <!-- Skrip JavaScript & Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    
    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    document.addEventListener("DOMContentLoaded", () => {
      const gridGaleri = document.getElementById('gridGaleri');
      onSnapshot(query(collection(db, "galeri"), orderBy("waktuInput", "desc")), (snapshot) => {
        gridGaleri.innerHTML = "";
        if (snapshot.empty) {
          gridGaleri.innerHTML = `<p class="text-xs text-gray-400 text-center col-span-full py-4">Belum ada foto galeri kegiatan.</p>`;
          return;
        }
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const fotoDiv = document.createElement('div');
          fotoDiv.className = "rounded-xl overflow-hidden h-36 border border-gray-100 shadow-sm bg-gray-50 flex items-center justify-center p-2 cursor-pointer";
          fotoDiv.innerHTML = `<img src="${item.url}" class="w-full h-full object-cover hover:scale-105 transition">`;
          
          fotoDiv.onclick = () => bukaZoom(item.url);
          gridGaleri.appendChild(fotoDiv);
        });
      }, (error) => {
        console.error("Gagal memuat galeri:", error);
        gridGaleri.innerHTML = `<p class="text-xs text-red-400 text-center col-span-full py-4">Gagal memuat galeri.</p>`;
      });
    });

    window.bukaZoom = (url) => {
      const modal = document.getElementById('modalZoom');
      const img = document.getElementById('gambarZoom');
      img.src = url;
      modal.className = 'visible-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
    };

    window.tutupZoom = () => {
      const modal = document.getElementById('modalZoom');
      modal.className = 'hidden-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
    };

    window.bukaDaftar = async (kategori) => {
      document.getElementById('mainDashboard').className = 'hidden-custom';
      document.getElementById('pageDaftar').className = 'visible-custom max-w-6xl mx-auto p-6';
      const area = document.getElementById('areaDaftar');
      area.innerHTML = `<p class="text-sm text-gray-500 text-center py-8">Memuat data ${kategori}...</p>`;
      
      try {
        const snap = await getDocs(query(collection(db, kategori), orderBy("waktuInput", "desc")));
        area.innerHTML = `<h3 class="text-xl font-extrabold text-blue-900 mb-6 capitalize border-b pb-3">Kategori: ${kategori}</h3>`;
        
        if (snap.empty) {
          area.innerHTML += `<p class="text-sm text-gray-400 text-center py-6">Belum ada konten pada kategori ini.</p>`;
          return;
        }

        const listDiv = document.createElement('div');
        listDiv.className = "grid grid-cols-1 md:grid-cols-2 gap-4";
        snap.forEach(d => {
          const data = d.data();
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-4 border rounded-xl hover:bg-blue-50 font-bold text-sm text-gray-800 transition shadow-sm flex items-center justify-between";
          btn.innerHTML = `<span>📄 ${data.judul}</span> <span class="text-blue-900 text-xs">Baca →</span>`;
          btn.onclick = () => bukaArtikel(data);
          listDiv.appendChild(btn);
        });
        area.appendChild(listDiv);
      } catch (err) {
        area.innerHTML = `<p class="text-sm text-red-500 text-center py-6">Gagal memuat data dari database.</p>`;
      }
    };

    window.bukaArtikel = (data) => {
      document.getElementById('pageDaftar').className = 'hidden-custom';
      document.getElementById('pageBaca').className = 'visible-custom max-w-6xl mx-auto p-6';
      document.getElementById('areaBaca').innerHTML = `
        <h2 class="text-2xl font-extrabold text-blue-900 mb-4">${data.judul}</h2>
        ${data.url ? `<img src="${data.url}" class="w-full h-auto rounded-xl mb-6 shadow-sm object-cover max-h-96 cursor-pointer" onclick="bukaZoom('${data.url}')">` : ''}
        <article class="text-base text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-6 rounded-xl border">${data.isi}</article>
      `;
    };

    window.kembaliKeDashboard = () => {
      document.getElementById('pageDaftar').className = 'hidden-custom';
      document.getElementById('pageBaca').className = 'hidden-custom';
      document.getElementById('mainDashboard').className = 'visible-custom max-w-6xl mx-auto p-6 space-y-6';
    };

    window.kembaliKeDaftar = () => {
      document.getElementById('pageBaca').className = 'hidden-custom';
      document.getElementById('pageDaftar').className = 'visible-custom max-w-6xl mx-auto p-6';
    };
  </script>
</body>
</html>
