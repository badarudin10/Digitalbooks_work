<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* CSS TAMBAHAN MURNI UNTUK RESPONSIVITAS (Tanpa Merubah Desain Asli) */
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block; }
    
    /* Memastikan body tidak menyebabkan horizontal scroll yang aneh */
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    
    /* Mencegah elemen melebihi layar pada perangkat sangat kecil */
    img, video {
      max-width: 100%;
      height: auto;
    }

    /* Memastikan kontainer utama selalu berada di tengah dan proporsional */
    .main-container {
      max-width: 448px; /* Sama dengan max-w-md */
      margin-left: auto;
      margin-right: auto;
      width: 100%;
      padding-left: 12px; /* Sama dengan p-3 */
      padding-right: 12px;
      box-sizing: border-box;
    }
    
    /* Penyesuaian agar bottom navbar tetap di posisi saat di PC/Laptop */
    .bottom-nav-wrapper {
      max-width: 448px;
      margin-left: auto;
      margin-right: auto;
      left: 0;
      right: 0;
      bottom: 0;
      position: fixed;
      z-index: 40;
    }
  </style>
  <title>Dashboard & Layanan - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen">
  
  <!-- Header Atas (Fluid width di PC, pas di HP) -->
  <header class="bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="main-container flex items-center justify-between !px-0">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-10 w-10 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm tracking-wide leading-tight">UPTD FARMASI</h1>
          <p class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA (Struktur asli, kini otomatis menenggah) -->
  <main id="mainDashboard" class="main-container space-y-3 pt-3 pb-32">
    
    <!-- Kartu Profil Pegawai (Ukuran Asli) -->

        <div>

          <p class="text-[9px] text-gray-600 font-mono mt-0.5">Kota Tangerang Selatan</p>
        </div>
        <!-- Ikon di Kanan (Ukuran Asli w-24 h-24) -->

      </div>
    </a>

    <!-- 2. Kotak Aksi Cepat (Struktur Grid Asli) -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">

        <button onclick="bukaDaftar('Informasi')" class="p-2 rounded-xl border border-blue-100 bg-[#f4f8fb] hover:bg-blue-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">

            <p class="text-[9px] text-gray-500">Update Arsip</p>
          </div>
        </button>
        <!-- Edukasi -->
        <button onclick="bukaDaftar('Edukasi')" class="p-2 rounded-xl border border-emerald-100 bg-[#f2faf5] hover:bg-emerald-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">
          <div class="w-12 h-12 flex items-center justify-center bg-transparent overflow-visible">
            <img src="https://i.ibb.co.com/SWQXc7m/Picsart-26-07-24-23-05-58-799.png" class="w-20 h-20 max-w-none object-contain">

          <div class="mt-2">
            <p class="text-xs font-bold text-gray-800 leading-tight">Edukasi</p>

        <!-- Layanan -->

            <img src="https://i.ibb.co.com/8QzyGR8/Picsart-26-07-24-23-04-30-680.png" class="w-20 h-20 max-w-none object-contain">
          </div>
          <div class="mt-2">
            <p class="text-xs font-bold text-gray-800 leading-tight">Kategori Obat</p>
            <p class="text-[9px] text-gray-500">Data Perbekalan</p>
          </div>

      </div>
    </div>

    <!-- 3. Galeri Kegiatan UPTD Farmasi (Integrasi Admin/Firebase) -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
          <span class="font-extrabold text-blue-900 text-xs tracking-wide">Galeri Kegiatan UPTD Farmasi</span>
        </div>
        <span class="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md font-bold">Dokumentasi</span>
      </div>
      <!-- Grid Foto Kegiatan Dinamis (Ukuran Asli h-20) -->
      <div id="gridGaleri" class="grid grid-cols-3 gap-2">
        <div class="col-span-3 text-center py-4 text-xs text-gray-400">Memuat galeri...</div>
      </div>
    </div>
  </main>

  <!-- KONTEN DINAMIS (Menyesuaikan lebar dalam frame) -->
  <div id="pageDaftar" class="hidden-custom main-container p-4">
    <button onclick="kembaliKeDashboard()" class="text-blue-900 font-bold mb-4 text-xs inline-flex items-center gap-1">← Kembali ke Dashboard</button>
    <div id="areaDaftar" class="bg-white p-4 rounded-2xl shadow-sm"></div>
  </div>

  <div id="pageBaca" class="hidden-custom main-container p-4">
    <button onclick="kembaliKeDaftar()" class="text-blue-900 font-bold mb-4 text-xs inline-flex items-center gap-1">← Kembali ke Daftar</button>
    <div id="areaBaca" class="bg-white p-5 rounded-2xl shadow-sm"></div>
  </div>

  <!-- MODAL ZOOM GAMBAR GALERI -->
  <div id="modalZoom" class="hidden-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="relative max-w-lg w-full">
      <button onclick="tutupZoom()" class="absolute -top-10 right-0 text-white font-bold text-lg bg-black/50 px-3 py-1 rounded-full hover:bg-black">✕ Tutup</button>
      <img id="gambarZoom" src="" class="w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl bg-white">
    </div>
  </div>

  <!-- Bottom Navigation Bar (Fixed di bawah secara rapi, tidak ikut scroll di PC) -->

    <nav class="bg-[#e3ede6] border-t border-emerald-300 shadow-lg py-2.5 px-6 flex justify-around items-center rounded-t-2xl">

      <a href="index.html#registrasi" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/Xf1wsJ41/Picsart-26-07-25-12-29-14-940.png" class="w-20 h-20 max-w-none object-contain">
        </div>
        <span class="text-[10px] mt-2 font-extrabold tracking-tight text-center">Registrasi</span>
      </a>
      <!-- Maps (Tautan ke kontak.html) -->
      <a href="kontak.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/5PtXnK6/Picsart-26-07-25-12-25-33-560.png" class="w-16 h-16 max-w-none object-contain">

        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Survei</span>

    </nav>
