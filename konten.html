<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block; }
  </style>
  <title>Dashboard & Layanan - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans pb-36 min-h-screen">

  <!-- Header Atas (Responsif: Lebar di PC, rapi di HP) -->
  <header class="bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b">
    <div class="max-w-2xl mx-auto w-full flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-10 w-10 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm md:text-base tracking-wide leading-tight">UPTD FARMASI</h1>
          <p class="text-[10px] md:text-xs text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA (Max-width optimal agar di HP proporsional dan di PC melebar rapi tanpa merusak komponen) -->
  <main id="mainDashboard" class="max-w-2xl mx-auto p-3 md:p-6 space-y-4">
    
    <!-- Kartu Profil Pegawai -->
    <a href="profil.html" class="block bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100 relative hover:border-blue-300 transition">
      <div class="flex items-center justify-between gap-4 text-left">
        <div>
          <p class="text-[10px] md:text-xs text-blue-900 font-extrabold uppercase tracking-wide">PROFIL PEGAWAI</p>
          <h2 class="text-sm md:text-lg font-extrabold text-gray-800 mt-0.5">UPTD FARMASI</h2>
          <p class="text-[10px] md:text-sm text-gray-600 font-mono mt-0.5">Kota Tangerang Selatan</p>
        </div>
        <div class="h-24 w-24 md:h-32 md:w-32 flex items-center justify-center flex-shrink-0 bg-transparent">
          <img src="https://i.ibb.co.com/jPB3ZPgJ/Picsart-26-07-24-23-07-31-642.png" class="w-full h-full object-contain">
        </div>
      </div>
    </a>

    <!-- 2. Kotak Aksi Cepat -->
    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex items-center gap-2 mb-3 text-gray-700 font-bold text-xs md:text-sm">
        <span class="text-blue-900">⇄</span> Aksi Cepat
      </div>
      <div class="grid grid-cols-2 gap-3 md:gap-4">
        
        <!-- Informasi -->
        <button onclick="bukaDaftar('Informasi')" class="p-3 md:p-4 rounded-xl border border-blue-100 bg-[#f4f8fb] hover:bg-blue-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">
          <div class="w-12 h-12 md:w-16 md:h-16 flex items-center justify-center bg-transparent overflow-visible">
            <img src="https://i.ibb.co.com/fzWd1Sq6/Picsart-26-07-24-23-03-05-634.png" class="w-20 h-20 md:w-28 md:h-28 max-w-none object-contain">
          </div>
          <div class="mt-2">
            <p class="text-xs md:text-sm font-bold text-gray-800 leading-tight">Informasi</p>
            <p class="text-[9px] md:text-xs text-gray-500">Update Arsip</p>
          </div>
        </button>

        <!-- Edukasi -->
        <button onclick="bukaDaftar('Edukasi')" class="p-3 md:p-4 rounded-xl border border-emerald-100 bg-[#f2faf5] hover:bg-emerald-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">
          <div class="w-12 h-12 md:w-16 md:h-16 flex items-center justify-center bg-transparent overflow-visible">
            <img src="https://i.ibb.co.com/SWQXc7m/Picsart-26-07-24-23-05-58-799.png" class="w-20 h-20 md:w-28 md:h-28 max-w-none object-contain">
          </div>
          <div class="mt-2">
            <p class="text-xs md:text-sm font-bold text-gray-800 leading-tight">Edukasi</p>
            <p class="text-[9px] md:text-xs text-gray-500">Materi & Panduan</p>
          </div>
        </button>

        <!-- Layanan ASN -->
        <button onclick="bukaDaftar('Pelayanan')" class="p-3 md:p-4 rounded-xl border border-purple-100 bg-[#faf5fb] hover:bg-purple-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">
          <div class="w-12 h-12 md:w-16 md:h-16 flex items-center justify-center bg-transparent overflow-visible">
            <img src="https://i.ibb.co.com/N6WBWsJT/Picsart-26-07-24-23-01-12-888.png" class="w-20 h-20 md:w-28 md:h-28 max-w-none object-contain">
          </div>
          <div class="mt-2">
            <p class="text-xs md:text-sm font-bold text-gray-800 leading-tight">Layanan</p>
            <p class="text-[9px] md:text-xs text-gray-500">Distribusi Logistik</p>
          </div>
        </button>

        <!-- Kategori Obat -->
        <button onclick="bukaDaftar('Obat')" class="p-3 md:p-4 rounded-xl border border-amber-100 bg-[#fdfaf2] hover:bg-amber-50 transition flex flex-col items-center justify-center text-center gap-1 overflow-visible">
          <div class="w-12 h-12 md:w-16 md:h-16 flex items-center justify-center bg-transparent overflow-visible">
            <img src="https://i.ibb.co.com/8QzyGR8/Picsart-26-07-24-23-04-30-680.png" class="w-20 h-20 md:w-28 md:h-28 max-w-none object-contain">
          </div>
          <div class="mt-2">
            <p class="text-xs md:text-sm font-bold text-gray-800 leading-tight">Kategori Obat</p>
            <p class="text-[9px] md:text-xs text-gray-500">Data Perbekalan</p>
          </div>
        </button>

      </div>
    </div>

    <!-- 3. Galeri Kegiatan UPTD Farmasi -->
    <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
          <span class="font-extrabold text-blue-900 text-xs md:text-sm tracking-wide">Galeri Kegiatan UPTD Farmasi</span>
        </div>
        <span class="text-[10px] md:text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md font-bold">Dokumentasi</span>
      </div>
      <!-- Grid Foto Kegiatan Dinamis -->
      <div id="gridGaleri" class="grid grid-cols-3 md:grid-cols-4 gap-3">
        <div class="col-span-full text-center py-4 text-xs text-gray-400">Memuat galeri...</div>
      </div>
    </div>
  </main>

  <!-- KONTEN DINAMIS -->
  <div id="pageDaftar" class="hidden-custom max-w-2xl mx-auto p-4 md:p-6">
    <button onclick="kembaliKeDashboard()" class="text-blue-900 font-bold mb-4 text-xs md:text-sm inline-flex items-center gap-1">← Kembali ke Dashboard</button>
    <div id="areaDaftar" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm"></div>
  </div>

  <div id="pageBaca" class="hidden-custom max-w-2xl mx-auto p-4 md:p-6">
    <button onclick="kembaliKeDaftar()" class="text-blue-900 font-bold mb-4 text-xs md:text-sm inline-flex items-center gap-1">← Kembali ke Daftar</button>
    <div id="areaBaca" class="bg-white p-5 md:p-8 rounded-2xl shadow-sm"></div>
  </div>

  <!-- MODAL ZOOM GAMBAR GALERI -->
  <div id="modalZoom" class="hidden-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="relative max-w-xl w-full">
      <button onclick="tutupZoom()" class="absolute -top-10 right-0 text-white font-bold text-sm bg-black/50 px-3 py-1.5 rounded-full hover:bg-black">✕ Tutup</button>
      <img id="gambarZoom" src="" class="w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl bg-white">
    </div>
  </div>

  <!-- Bottom Navigation Bar (Fixed rapi di bawah dengan ukuran proporsional) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#e3ede6] border-t border-emerald-300 shadow-xl py-3 px-6 flex justify-around items-center z-40 max-w-2xl mx-auto rounded-t-2xl">
    
    <!-- Registrasi -->
    <a href="index.html#registrasi" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
      <div class="w-7 h-7 md:w-8 md:h-8 flex items-center justify-center overflow-visible">
        <img src="https://i.ibb.co.com/Xf1wsJ41/Picsart-26-07-25-12-29-14-940.png" class="w-20 h-20 md:w-24 md:h-24 max-w-none object-contain">
      </div>
      <span class="text-[10px] md:text-xs mt-1.5 font-extrabold tracking-tight text-center">Registrasi</span>
    </a>

    <!-- Maps -->
    <a href="kontak.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
      <div class="w-7 h-7 md:w-8 md:h-8 flex items-center justify-center overflow-visible">
        <img src="https://i.ibb.co.com/5PtXnK6/Picsart-26-07-25-12-25-33-560.png" class="w-16 h-16 md:w-20 md:h-20 max-w-none object-contain">
      </div>
      <span class="text-[10px] md:text-xs mt-1.5 font-bold tracking-tight text-center">Maps</span>
    </a>
    
    <!-- Tamu -->
    <a href="registrasi.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
      <div class="w-7 h-7 md:w-8 md:h-8 flex items-center justify-center overflow-visible">
        <img src="https://i.ibb.co.com/YBSNWNGM/Picsart-26-07-24-23-37-45-946.png" class="w-24 h-24 md:w-28 md:h-28 max-w-none object-contain">
      </div>
      <span class="text-[10px] md:text-xs mt-1.5 font-bold tracking-tight text-center">Tamu</span>
    </a>

    <!-- Survei -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSexxMw_FdW-XT6yTyiPUVnpFyKf_j01-4lk-JmiQRrT3IC04A/viewform" target="_blank" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
      <div class="w-7 h-7 md:w-8 md:h-8 flex items-center justify-center overflow-visible">
        <img src="https://i.ibb.co.com/M5D0s0t9/Picsart-26-07-25-11-29-02-111.png" class="w-24 h-24 md:w-28 md:h-28 max-w-none object-contain">
      </div>
      <span class="text-[10px] md:text-xs mt-1.5 font-bold tracking-tight text-center">Survei</span>
    </a>
  </nav>

  <!-- Skrip JavaScript & Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    
    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    document.addEventListener("DOMContentLoaded", () => {
      const gridGaleri = document.getElementById('gridGaleri');
      onSnapshot(query(collection(db, "galeri"), orderBy("waktuInput", "desc")), (snapshot) => {
        gridGaleri.innerHTML = "";
        if (snapshot.empty) {
          gridGaleri.innerHTML = `<p class="text-xs text-gray-400 text-center col-span-full py-3">Belum ada foto galeri kegiatan.</p>`;
          return;
        }
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const fotoDiv = document.createElement('div');
          fotoDiv.className = "rounded-xl overflow-hidden h-24 md:h-32 border border-gray-100 shadow-sm bg-gray-50 flex items-center justify-center p-2 cursor-pointer";
          fotoDiv.innerHTML = `<img src="${item.url}" class="w-full h-full object-cover hover:scale-105 transition">`;
          
          fotoDiv.onclick = () => bukaZoom(item.url);
          gridGaleri.appendChild(fotoDiv);
        });
      }, (error) => {
        console.error("Gagal memuat galeri:", error);
        gridGaleri.innerHTML = `<p class="text-xs text-red-400 text-center col-span-full py-3">Gagal memuat galeri.</p>`;
      });
    });

    window.bukaZoom = (url) => {
      const modal = document.getElementById('modalZoom');
      const img = document.getElementById('gambarZoom');
      img.src = url;
      modal.className = 'visible-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
    };

    window.tutupZoom = () => {
      const modal = document.getElementById('modalZoom');
      modal.className = 'hidden-custom fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4';
    };

    window.bukaDaftar = async (kategori) => {
      document.getElementById('mainDashboard').className = 'hidden-custom';
      document.getElementById('pageDaftar').className = 'visible-custom max-w-2xl mx-auto p-4 md:p-6';
      const area = document.getElementById('areaDaftar');
      area.innerHTML = `<p class="text-xs md:text-sm text-gray-500 text-center py-6">Memuat data ${kategori}...</p>`;
      
      try {
        const snap = await getDocs(query(collection(db, kategori), orderBy("waktuInput", "desc")));
        area.innerHTML = `<h3 class="text-base md:text-xl font-extrabold text-blue-900 mb-4 capitalize border-b pb-2">Kategori: ${kategori}</h3>`;
        
        if (snap.empty) {
          area.innerHTML += `<p class="text-xs md:text-sm text-gray-400 text-center py-4">Belum ada konten pada kategori ini.</p>`;
          return;
        }

        const listDiv = document.createElement('div');
        listDiv.className = "space-y-2";
        snap.forEach(d => {
          const data = d.data();
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-3 md:p-4 border rounded-xl hover:bg-blue-50 font-bold text-xs md:text-sm text-gray-800 transition shadow-sm flex items-center justify-between";
          btn.innerHTML = `<span>📄 ${data.judul}</span> <span class="text-blue-900 text-[10px] md:text-xs">Baca →</span>`;
          btn.onclick = () => bukaArtikel(data);
          listDiv.appendChild(btn);
        });
        area.appendChild(listDiv);
      } catch (err) {
        area.innerHTML = `<p class="text-xs md:text-sm text-red-500 text-center py-4">Gagal memuat data dari database.</p>`;
      }
    };

    window.bukaArtikel = (data) => {
      document.getElementById('pageDaftar').className = 'hidden-custom';
      document.getElementById('pageBaca').className = 'visible-custom max-w-2xl mx-auto p-4 md:p-6';
      document.getElementById('areaBaca').innerHTML = `
        <h2 class="text-lg md:text-2xl font-extrabold text-blue-900 mb-3">${data.judul}</h2>
        ${data.url ? `<img src="${data.url}" class="w-full h-auto rounded-xl mb-4 shadow-sm object-cover max-h-80 cursor-pointer" onclick="bukaZoom('${data.url}')">` : ''}
        <article class="text-xs md:text-base text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-4 md:p-6 rounded-xl border">${data.isi}</article>
      `;
    };

    window.kembaliKeDashboard = () => {
      document.getElementById('pageDaftar').className = 'hidden-custom';
      document.getElementById('pageBaca').className = 'hidden-custom';
      document.getElementById('mainDashboard').className = 'visible-custom max-w-2xl mx-auto p-3 md:p-6 space-y-4';
    };

    window.kembaliKeDaftar = () => {
      document.getElementById('pageBaca').className = 'hidden-custom';
      document.getElementById('pageDaftar').className = 'visible-custom max-w-2xl mx-auto p-4 md:p-6';
    };
  </script>
</body>
</html>
