<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library html2pdf untuk cetak bukti PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Buku Tamu & Status - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen pb-24">

  <!-- Header Atas (Judul di Tengah) -->
  <header class="bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="max-w-md mx-auto text-center">
      <h1 class="font-extrabold text-blue-900 text-xs tracking-wide leading-tight">STATUS & BUKTI TAMU</h1>
      <p class="text-[9px] text-gray-600 font-semibold uppercase tracking-wider mt-0.5">UPTD Farmasi Tangsel</p>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Kartu Informasi -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
      <h2 class="text-sm font-extrabold text-blue-900">Daftar Tamu & Pengambilan Obat</h2>
      <p class="text-[11px] text-gray-500 mt-0.5">Cek status registrasi Anda secara real-time dan download bukti PDF</p>
    </div>

    <!-- Container Daftar Tamu dari Firestore (Sinkron dengan admin.html) -->
    <div id="containerTamu" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
        Memuat data registrasi...
      </div>
    </div>

  </main>

  <!-- Tombol Kembali di Bagian Bawah Sebelah Kanan -->
  <div class="max-w-md mx-auto px-4 mt-6 flex justify-end">
    <a href="konten.html" class="bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition inline-flex items-center gap-1.5">
      ← Kembali
    </a>
  </div>

  <!-- Area Tersembunyi untuk Format Cetak PDF Bukti Pengambilan Obat -->
  <div id="areaCetakPdf" style="display: none;"></div>

  <!-- SKRIP FIREBASE & LOGIKA HALAMAN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    // Sinkronisasi data real-time dengan Firestore (koleksi bukuTamu / admin)
    onSnapshot(query(collection(db, "bukuTamu"), orderBy("waktuInput", "desc")), (snapshot) => {
      const container = document.getElementById("containerTamu");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
            Belum ada riwayat registrasi yang tercatat.
          </div>
        `;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();

        // Status badge styling
        let statusColor = "bg-amber-50 text-amber-800 border-amber-200";
        let statusText = "Menunggu";
        if (item.status === "Diproses") {
          statusColor = "bg-blue-50 text-blue-800 border-blue-200";
          statusText = "Diproses";
        } else if (item.status === "Selesai") {
          statusColor = "bg-emerald-50 text-emerald-800 border-emerald-200";
          statusText = "Selesai";
        }

        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <h3 class="font-extrabold text-xs text-blue-900">${item.nama || item.namaTamu || 'Tanpa Nama'}</h3>
              <p class="text-[10px] text-gray-600 mt-0.5"><b>Keperluan:</b> ${item.keperluan || item.tujuan || '-'}</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border shrink-0 ${statusColor}">
              ${statusText}
            </span>
          </div>
          <div class="border-t pt-2 flex justify-between items-center text-[10px] text-gray-500">
            <span><b>Waktu:</b> ${item.tanggal || item.waktu || 'Baru saja'}</span>
            <button onclick='downloadPdf(${JSON.stringify(item)})' class="bg-blue-900 hover:bg-blue-800 text-white px-3 py-1.5 rounded-xl font-bold transition shadow-sm">
              Download PDF 📥
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      console.error("Gagal memuat data tamu:", error);
      document.getElementById("containerTamu").innerHTML = `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-red-400">
          Gagal memuat data dari database.
        </div>
      `;
    });

    // Fungsi cetak PDF sesuai format instruksi Anda
    window.downloadPdf = (data) => {
      const areaCetak = document.getElementById("areaCetakPdf");
      areaCetak.style.display = "block";
      areaCetak.innerHTML = `
        <div style="padding: 30px; font-family: Arial, sans-serif; color: #1e3a8a; max-width: 450px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 8px;">
          <div style="text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 12px; margin-bottom: 20px;">
            <h2 style="font-size: 15px; margin: 0; font-weight: bold;">UPTD FARMASI KOTA TANGERANG SELATAN</h2>
            <p style="font-size: 10px; color: #555; margin: 4px 0 0 0;">Bukti Resmi Pengambilan Obat & Kunjungan Tamu</p>
          </div>
          <div style="font-size: 12px; color: #333; line-height: 1.8;">
            <p style="margin: 6px 0;"><b>Nama :</b> ${data.nama || data.namaTamu || '-'}</p>
            <p style="margin: 6px 0;"><b>Instansi :</b> ${data.instansi || '-'}</p>
            <p style="margin: 6px 0;"><b>Keperluan :</b> ${data.keperluan || data.tujuan || '-'}</p>
            <p style="margin: 6px 0;"><b>Nama petugas penerima :</b> ${data.petugas || data.namaPetugas || '-'}</p>
            <p style="margin: 6px 0;"><b>Waktu :</b> ${data.tanggal || data.waktu || '-'}</p>
            <p style="margin: 6px 0;"><b>Status :</b> ${data.status || 'Menunggu'}</p>
          </div>
          <div style="margin-top: 30px; text-align: center; font-size: 9px; color: #777; border-top: 1px solid #eee; padding-top: 12px;">
            <p>Dokumen ini diterbitkan secara resmi dan sah melalui Sistem UPTD Farmasi Tangsel.</p>
          </div>
        </div>
      `;

      const opt = {
        margin:       10,
        filename:     `Bukti_Pengambilan_Obat_${data.nama || 'Tamu'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(areaCetak).save().then(() => {
        areaCetak.style.display = "none";
      });
    };
  </script>
</body>
</html>
