<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library html2pdf untuk cetak bukti PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Buku Tamu & Status - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen pb-24">

  <!-- Header Atas (Judul di Tengah) -->
  <header class="bg-[#e3ede6] px-4 py-3.5 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="max-w-md mx-auto text-center">
      <h1 class="font-extrabold text-blue-900 text-xs tracking-wider leading-tight uppercase">STATUS & BUKTI TAMU</h1>
      <p class="text-[9px] text-gray-600 font-semibold uppercase tracking-widest mt-0.5">UPTD Farmasi Tangsel</p>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Kartu Informasi -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center space-y-1">
      <h2 class="text-sm font-extrabold text-blue-900">Daftar Tamu & Pengambilan Obat</h2>
      <p class="text-[11px] text-gray-500 leading-relaxed">Cek status registrasi Anda secara real-time dan download bukti PDF pengambilan obat.</p>
    </div>

    <!-- Container Daftar Tamu dari Firestore -->
    <div id="containerTamu" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
        Memuat data registrasi dari database...
      </div>
    </div>

  </main>

  <!-- Tombol Kembali di Bagian Bawah Sebelah Kanan -->
  <div class="max-w-md mx-auto px-4 mt-6 flex justify-end">
    <a href="konten.html" class="bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition inline-flex items-center gap-1.5">
      ← Kembali
    </a>
  </div>

  <!-- Area Tersembunyi untuk Format Cetak PDF Bukti Pengambilan Obat -->
  <div id="areaCetakPdf" style="display: none;"></div>

  <!-- SKRIP FIREBASE & LOGIKA HALAMAN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    // Menghubungkan langsung ke koleksi "tamu" sesuai database Firestore Anda
    const q = query(collection(db, "tamu"), orderBy("waktu", "desc"));

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("containerTamu");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
            Belum ada riwayat registrasi yang tercatat di sistem.
          </div>
        `;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();

        // Format waktu jika berupa Firestore Timestamp
        let waktuStr = item.waktu || '-';
        if (item.waktu && typeof item.waktu.toDate === 'function') {
          waktuStr = item.waktu.toDate().toLocaleString('id-ID');
        }

        // Status badge styling
        let statusColor = "bg-amber-50 text-amber-800 border-amber-200";
        let statusText = item.status || "Menunggu";
        if (item.status === "Diproses" || item.status === "diproses") {
          statusColor = "bg-blue-50 text-blue-800 border-blue-200";
        } else if (item.status === "Selesai" || item.status === "selesai") {
          statusColor = "bg-emerald-50 text-emerald-800 border-emerald-200";
        }

        // Ambil data obat yang diterima dari admin (mendukung field: obatDiterima, daftarObat, atau obat)
        const obatTerima = item.obatDiterima || item.daftarObat || item.obat || '-';

        // Simpan data terformat ke object item agar ikut terbawa saat tombol download diklik
        item.waktuFormatted = waktuStr;
        item.obatTerimaFormatted = obatTerima;

        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="space-y-0.5">
              <h3 class="font-extrabold text-xs text-blue-900">${item.nama || 'Tanpa Nama'}</h3>
              <p class="text-[10px] text-gray-600"><b>Instansi:</b> ${item.instansi || '-'}</p>
              <p class="text-[10px] text-gray-600"><b>Keperluan:</b> ${item.keperluan || '-'}</p>
              ${item.nomorAntrian ? `<p class="text-[10px] text-blue-700 font-bold">No. Antrian: ${item.nomorAntrian}</p>` : ''}
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border shrink-0 ${statusColor}">
              ${statusText}
            </span>
          </div>

          <!-- Bagian Informasi Obat yang Diterima -->
          <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100 text-[10px] space-y-1">
            <p class="text-blue-900 font-bold">💊 Obat yang Diterima:</p>
            <p class="text-gray-700 whitespace-pre-line">${obatTerima}</p>
          </div>

          <div class="border-t pt-2 flex justify-between items-center text-[10px] text-gray-500">
            <span><b>Waktu:</b> ${waktuStr}</span>
            <button onclick='downloadPdf(${JSON.stringify(item)})' class="bg-blue-900 hover:bg-blue-800 text-white px-3 py-1.5 rounded-xl font-bold transition shadow-sm inline-flex items-center gap-1">
              Download PDF 📥
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      console.error("Gagal memuat data tamu:", error);
      document.getElementById("containerTamu").innerHTML = `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-red-400">
          Gagal memuat data dari database.
        </div>
      `;
    });

        // Fungsi cetak PDF dengan format ukuran F4 dan penataan daftar obat ke bawah
    window.downloadPdf = (data) => {
      const areaCetak = document.getElementById("areaCetakPdf");
      areaCetak.style.display = "block";
      areaCetak.innerHTML = `
        <div style="padding: 40px; font-family: Arial, sans-serif; color: #1e3a8a; width: 100%; max-width: 650px; margin: 0 auto; background: #fff; box-sizing: border-box;">
          
          <!-- Kop Surat / Judul Dokumen -->
          <div style="text-align: center; border-bottom: 3px double #1e3a8a; padding-bottom: 15px; margin-bottom: 25px;">
            <h2 style="font-size: 18px; margin: 0; font-weight: bold; letter-spacing: 0.5px;">UPTD FARMASI KOTA TANGERANG SELATAN</h2>
            <p style="font-size: 11px; color: #555; margin: 6px 0 0 0; text-transform: uppercase; font-weight: 600;">Bukti Resmi Pengambilan Obat & Kunjungan Tamu</p>
          </div>

          <!-- Informasi Detail Tamu -->
          <div style="font-size: 13px; color: #333; line-height: 2;">
            <table style="width: 100%; border-collapse: collapse;">
              <tr>
                <td style="width: 160px; font-weight: bold;">Nama Tamu</td>
                <td style="width: 15px;">:</td>
                <td>${data.nama || '-'}</td>
              </tr>
              <tr>
                <td style="font-weight: bold;">Instansi / Asal</td>
                <td>:</td>
                <td>${data.instansi || '-'}</td>
              </tr>
              <tr>
                <td style="font-weight: bold;">Keperluan</td>
                <td>:</td>
                <td>${data.keperluan || '-'}</td>
              </tr>
              <tr>
                <td style="font-weight: bold;">Petugas Penerima</td>
                <td>:</td>
                <td>${data.petugas || data.namaPetugas || '-'}</td>
              </tr>
              <tr>
                <td style="font-weight: bold;">Waktu Kunjungan</td>
                <td>:</td>
                <td>${data.waktuFormatted || data.waktu || '-'}</td>
              </tr>
              <tr>
                <td style="font-weight: bold;">Status Pelayanan</td>
                <td>:</td>
                <td><span style="font-weight: bold; color: #047857; text-transform: uppercase;">${data.status || 'Selesai'}</span></td>
              </tr>
            </table>
          </div>

          <!-- Kotak Daftar Obat yang Diterima -->
          <div style="margin-top: 25px; padding: 15px 20px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px;">
            <p style="margin: 0 0 8px 0; font-weight: bold; color: #1e3a8a; font-size: 13px; text-transform: uppercase;">💊 Daftar Obat / Barang yang Diterima:</p>
            <div style="margin: 0; white-space: pre-line; color: #1e293b; font-size: 13px; line-height: 1.8;">${data.obatTerimaFormatted || '-'}</div>
          </div>

          <!-- Catatan / Footer Dokumen -->
          <div style="margin-top: 60px; display: flex; justify-content: space-between; align-items: flex-end;">
            <div style="font-size: 10px; color: #64748b;">
              <p style="margin: 0;">Dokumen ini diterbitkan secara elektronik dan sah melalui Sistem UPTD Farmasi Tangsel.</p>
            </div>
            <div style="text-align: center; font-size: 12px; color: #333; min-width: 180px;">
              <p style="margin: 0 0 50px 0;">Penerima / Tamu,</p>
              <p style="margin: 0; font-weight: bold; text-decoration: underline;">${data.nama || '......................................'}</p>
            </div>
          </div>

        </div>
      `;

      // Konfigurasi ukuran F4 (210mm x 330mm) menggunakan html2pdf
      const opt = {
        margin:       10,
        filename:     `Bukti_Pengambilan_Obat_${data.nama || 'Tamu'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: [210, 330], orientation: 'portrait' }
      };

      html2pdf().from(areaCetak).set(opt).save().then(() => {
        areaCetak.style.display = "none";
      });
    };
  </script>
</body>
</html>
