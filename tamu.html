<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none !important; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block !important; }
    
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    
    img, video {
      max-width: 100%;
      height: auto;
    }

    /* Penyesuaian layout grid PC/Laptop agar konsisten */
    @media (min-width: 1024px) {
      .app-layout-wrapper {
        max-width: 1200px !important;
        margin-left: auto;
        margin-right: auto;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 20px;
        padding: 20px;
      }
      .pc-sidebar {
        grid-column: span 3 / span 3;
        display: flex !important;
        flex-direction: column;
        gap: 16px;
      }
      .pc-main-content {
        grid-column: span 9 / span 9;
      }
      .bottom-nav-wrapper {
        display: none !important;
      }
      .pc-header-desktop {
        display: block !important;
      }
      .mobile-header-bar {
        display: none !important;
      }
    }

    @media (max-width: 1023px) {
      .pc-sidebar {
        display: none !important;
      }
      .pc-header-desktop {
        display: none !important;
      }
      .mobile-header-bar {
        display: block !important;
      }
      .main-container {
        max-width: 448px;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        padding-left: 12px;
        padding-right: 12px;
        box-sizing: border-box;
      }
      .bottom-nav-wrapper {
        max-width: 448px;
        margin-left: auto;
        margin-right: auto;
        left: 0;
        right: 0;
        bottom: 0;
        position: fixed;
        z-index: 40;
      }
    }
  </style>
  <title>Buku Tamu - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen pb-24 lg:pb-6">
  
  <!-- Header Atas (Hanya tampil di Mobile/HP) -->
  <header class="mobile-header-bar bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-10 w-10 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm tracking-wide leading-tight">UPTD FARMASI</h1>
          <p class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTROL UTAMA LAYOUT RESPONSIF -->
  <div class="app-layout-wrapper">

    <!-- SIDEBAR KIRI KHUSUS PC -->
    <aside class="pc-sidebar space-y-4">
      <!-- Kartu Profil Pegawai -->
      <a href="profil.html" class="block bg-white p-4 rounded-2xl shadow-sm border border-gray-100 relative hover:border-blue-300 transition text-center">
        <div class="flex flex-col items-center gap-2">
          <div class="h-28 w-28 flex items-center justify-center flex-shrink-0 bg-transparent">
            <img src="https://i.ibb.co.com/jPB3ZPgJ/Picsart-26-07-24-23-07-31-642.png" class="w-full h-full object-contain">
          </div>
          <div>
            <h2 class="text-xs font-extrabold text-gray-800">Profil Pegawai</h2>
            <p class="text-[11px] text-blue-900 font-extrabold uppercase tracking-wide mt-0.5">UPTD FARMASI</p>
          </div>
        </div>
      </a>

      <!-- Menu Navigasi Samping -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <nav class="space-y-1.5">
          <a href="index.html#registrasi" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-emerald-50 text-emerald-900 font-bold text-xs transition">
            <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/Xf1wsJ41/Picsart-26-07-25-12-29-14-940.png" class="w-full h-full object-contain">
            </div>
            <span class="text-xs">Registrasi</span>
          </a>
          <a href="maps.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-emerald-50 text-emerald-900 font-bold text-xs transition">
            <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/5PtXnK6/Picsart-26-07-25-12-25-33-560.png" class="w-full h-full object-contain">
            </div>
            <span class="text-xs">Maps</span>
          </a>
          <a href="tamu.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-emerald-50 text-emerald-900 font-bold text-xs transition">
            <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/YBSNWNGM/Picsart-26-07-24-23-37-45-946.png" class="w-full h-full object-contain">
            </div>
            <span class="text-xs">Tamu</span>
          </a>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSexxMw_FdW-XT6yTyiPUVnpFyKf_j01-4lk-JmiQRrT3IC04A/viewform" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-emerald-50 text-emerald-900 font-bold text-xs transition">
            <div class="w-10 h-10 flex items-center justify-center flex-shrink-0">
              <img src="https://i.ibb.co.com/M5D0s0t9/Picsart-26-07-25-11-29-02-111.png" class="w-full h-full object-contain">
            </div>
            <span class="text-xs">Survei</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- KONTEN UTAMA TAMU -->
    <div class="pc-main-content w-full">
      <main class="main-container lg:max-w-none space-y-3 pt-1 pb-3">
        
        <!-- Header Khusus Desktop -->
        <div class="pc-header-desktop hidden bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-3">
          <div class="flex items-center gap-3">
            <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-12 w-12 object-contain">
            <div>
              <h1 class="font-extrabold text-blue-900 text-base tracking-wide leading-tight">UPTD FARMASI</h1>
              <p class="text-xs text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
            </div>
          </div>
        </div>

        <!-- Tombol Kembali ke Beranda / Dashboard -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 mb-3">
          <a href="index.html" class="text-blue-900 font-bold text-xs inline-flex items-center gap-1 hover:underline">← Kembali ke Beranda</a>
        </div>

        <!-- Kotak Formulir Buku Tamu -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-2 mb-4 border-b pb-2">
            <span class="text-blue-900">📝</span>
            <h2 class="font-extrabold text-blue-900 text-sm tracking-wide">Formulir Buku Tamu UPTD Farmasi</h2>
          </div>

          <!-- Form Buku Tamu (Sesuaikan id atau aksi form dengan database/script Anda sebelumnya) -->
          <form id="formBukuTamu" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Nama Lengkap</label>
              <input type="text" id="namaTamu" required class="w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-300 outline-none" placeholder="Masukkan nama lengkap...">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Asal Instansi / Unit Kerja</label>
              <input type="text" id="instansiTamu" required class="w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-300 outline-none" placeholder="Contoh: Puskesmas / Dinas / Umum">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Nomor WhatsApp</label>
              <input type="tel" id="waTamu" required class="w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-300 outline-none" placeholder="08xxxxxxxxxx">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Keperluan / Tujuan Kunjungan</label>
              <textarea id="keperluanTamu" rows="3" required class="w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-blue-300 outline-none" placeholder="Tuliskan keperluan kunjungan Anda..."></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold p-3 rounded-xl text-xs transition shadow-sm">
              Kirim Buku Tamu
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Hanya tampil di Mobile/HP) -->
  <div class="bottom-nav-wrapper">
    <nav class="bg-[#e3ede6] border-t border-emerald-300 shadow-lg py-2.5 px-6 flex justify-around items-center rounded-t-2xl">
      <a href="index.html#registrasi" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/Xf1wsJ41/Picsart-26-07-25-12-29-14-940.png" class="w-20 h-20 max-w-none object-contain">
        </div>
        <span class="text-[10px] mt-2 font-extrabold tracking-tight text-center">Registrasi</span>
      </a>
      <a href="maps.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/5PtXnK6/Picsart-26-07-25-12-25-33-560.png" class="w-16 h-16 max-w-none object-contain">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Maps</span>

      <a href="tamu.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/YBSNWNGM/Picsart-26-07-24-23-37-45-946.png" class="w-24 h-24 max-w-none object-contain">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Tamu</span>
      </a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSexxMw_FdW-XT6yTyiPUVnpFyKf_j01-4lk-JmiQRrT3IC04A/viewform" target="_blank" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/M5D0s0t9/Picsart-26-07-25-11-29-02-111.png" class="w-24 h-24 max-w-none object-contain">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Survei</span>
      </a>
    </nav>

  <!-- Skrip Tambahan jika menggunakan Firebase / Script khusus tamu -->

    // Tempatkan logika Firebase / simpan buku tamu Anda di sini jika diperlukan
