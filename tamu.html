<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library html2pdf untuk cetak bukti PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Buku Tamu & Status - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen pb-16">

  <!-- Header Atas -->
  <header class="bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="konten.html" class="text-blue-900 font-bold text-xs inline-flex items-center gap-1">← Kembali</a>
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm tracking-wide leading-tight">RIWAYAT & STATUS TAMU</h1>
          <p class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider">UPTD Farmasi Tangsel</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Informasi & Judul -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
      <h2 class="text-base font-extrabold text-blue-900">Daftar Tamu & Pengambilan</h2>
      <p class="text-xs text-gray-500 mt-1">Cek status kunjungan atau registrasi Anda secara real-time</p>
    </div>

    <!-- Container Daftar Tamu dari Firestore -->
    <div id="containerTamu" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
        Memuat data tamu...
      </div>
    </div>

  </main>

  <!-- Area Tersembunyi untuk Format Cetak PDF Bukti Tamu/Pengambilan -->
  <div id="areaCetakPdf" style="display: none;"></div>

  <!-- SKRIP FIREBASE & LOGIKA HALAMAN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    // Mendengarkan perubahan data secara real-time dari koleksi "bukuTamu" atau "registrasi"
    onSnapshot(query(collection(db, "bukuTamu"), orderBy("waktuInput", "desc")), (snapshot) => {
      const container = document.getElementById("containerTamu");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
            Belum ada riwayat tamu atau registrasi yang tercatat.
          </div>
        `;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const idData = docSnap.id;

        // Tentukan warna badge status
        let statusColor = "bg-amber-50 text-amber-800 border-amber-200";
        let statusText = "Menunggu";
        if (item.status === "Diproses") {
          statusColor = "bg-blue-50 text-blue-800 border-blue-200";
          statusText = "Diproses";
        } else if (item.status === "Selesai") {
          statusColor = "bg-emerald-50 text-emerald-800 border-emerald-200";
          statusText = "Selesai";
        }

        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-extrabold text-xs text-blue-900">${item.nama || item.namaTamu || 'Tanpa Nama'}</h3>
              <p class="text-[10px] text-gray-500 mt-0.5">Keperluan: ${item.keperluan || item.tujuan || '-'}</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${statusColor}">
              ${statusText}
            </span>
          </div>
          <div class="border-t pt-2 flex justify-between items-center text-[10px] text-gray-500">
            <span>Waktu: ${item.tanggal || item.waktu || 'Baru saja'}</span>
            <button onclick='downloadPdf(${JSON.stringify(item)})' class="bg-blue-900 hover:bg-blue-800 text-white px-3 py-1.5 rounded-xl font-bold transition">
              Download PDF 📥
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      console.error("Gagal memuat data tamu:", error);
      document.getElementById("containerTamu").innerHTML = `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-red-400">
          Gagal memuat data dari database.
        </div>
      `;
    });

    // Fungsi untuk mendownload bukti dalam format PDF
    window.downloadPdf = (data) => {
      const areaCetak = document.getElementById("areaCetakPdf");
      areaCetak.style.display = "block";
      areaCetak.innerHTML = `
        <div style="padding: 24px; font-family: sans-serif; color: #1e3a8a; max-width: 400px; margin: 0 auto; background: #fff;">
          <div style="text-align: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 12px; margin-bottom: 16px;">
            <h2 style="font-size: 16px; margin: 0; font-weight: bold;">UPTD FARMASI KOTA TANGERANG SELATAN</h2>
            <p style="font-size: 10px; color: #555; margin: 4px 0 0 0;">Bukti Registrasi / Kunjungan Tamu</p>
          </div>
          <div style="font-size: 12px; color: #333; line-height: 1.6;">
            <p><b>Nama:</b> ${data.nama || data.namaTamu || '-'}</p>
            <p><b>Instansi / Asal:</b> ${data.instansi || '-'}</p>
            <p><b>Keperluan / Tujuan:</b> ${data.keperluan || data.tujuan || '-'}</p>
            <p><b>Status:</b> ${data.status || 'Menunggu'}</p>
            <p><b>Waktu Input:</b> ${data.tanggal || data.waktu || '-'}</p>
          </div>
          <div style="margin-top: 24px; text-align: center; font-size: 10px; color: #777; border-top: 1px solid #eee; pt-12px;">
            <p>Dokumen ini dicetak secara digital melalui Sistem UPTD Farmasi Tangsel.</p>
          </div>
        </div>
      `;

      const opt = {
        margin:       10,
        filename:     `Bukti_Kunjungan_${data.nama || 'Tamu'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(areaCetak).save().then(() => {
        areaCetak.style.display = "none";
      });
    };
  </script>
</body>
</html>
