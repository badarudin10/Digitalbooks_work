<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library html2pdf untuk cetak bukti PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none !important; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block !important; }
    
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    
    img, video {
      max-width: 100%;
      height: auto;
    }

    /* Penyesuaian layout lebar maksimum untuk Desktop/PC tanpa sidebar kiri */
    @media (min-width: 1024px) {
      .app-layout-wrapper {
        max-width: 1280px !important;
        margin-left: auto;
        margin-right: auto;
        padding: 24px;
      }
      .bottom-nav-wrapper {
        display: none !important;
      }
      .pc-header-desktop {
        display: block !important;
      }
      .mobile-header-bar {
        display: none !important;
      }
    }

    @media (max-width: 1023px) {
      .pc-header-desktop {
        display: none !important;
      }
      .mobile-header-bar {
        display: block !important;
      }
      .main-container {
        max-width: 448px;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        /* Diperlebar sedikit jarak padding kiri & kanan agar tidak menempel ke tepi layar HP */
        padding-left: 16px;
        padding-right: 16px;
        box-sizing: border-box;
      }
      .bottom-nav-wrapper {
        max-width: 448px;
        margin-left: auto;
        margin-right: auto;
        left: 0;
        right: 0;
        bottom: 0;
        position: fixed;
        z-index: 40;
      }
    }
  </style>
  <title>Buku Tamu & Status - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#d1e7dd] font-sans min-h-screen pb-24 lg:pb-6">

  <!-- Header Atas (Hanya tampil di Mobile/HP) -->
  <header class="mobile-header-bar bg-[#d1e7dd] px-4 py-3.5 shadow-sm sticky top-0 z-30 border border-blue-200">
    <div class="max-w-md mx-auto text-center">
      <h1 class="font-extrabold text-blue-900 text-xs tracking-wider leading-tight uppercase">STATUS & BUKTI TAMU</h1>
      <p class="text-[9px] text-gray-600 font-semibold uppercase tracking-widest mt-0.5">UPTD Farmasi Tangsel</p>
    </div>
  </header>

  <!-- KONTROL UTAMA LAYOUT RESPONSIF TANPA SIDEBAR KIRI -->
  <div class="app-layout-wrapper w-full">

    <!-- KONTEN UTAMA (DIPERLEBAR MAKSIMAL DI PC) -->
    <div class="w-full">
      <main class="main-container lg:max-w-none space-y-4 pt-1 pb-3">
        
        <!-- Header Khusus Desktop (Kotak pembungkus dan logo dihilangkan) -->
        <div class="pc-header-desktop hidden mb-3 px-1">
          <div>
            <h1 class="font-extrabold text-blue-900 text-lg tracking-wide leading-tight">STATUS & BUKTI TAMU</h1>
            <p class="text-xs text-gray-700 font-semibold uppercase tracking-wider mt-0.5">UPTD Farmasi Kota Tangerang Selatan</p>
          </div>
        </div>

        <!-- Kartu Informasi -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border-2 border-blue-400 text-center space-y-1 mb-5">
          <h2 class="text-sm font-extrabold text-blue-900">Daftar Tamu & Pengambilan Obat</h2>
          <p class="text-[11px] text-gray-500 leading-relaxed">Cek status registrasi Anda secara real-time dan download bukti PDF pengambilan obat.</p>
        </div>

        <!-- Container Daftar Tamu dari Firestore -->
        <div id="containerTamu" class="space-y-3">
          <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-blue-400 text-center text-xs text-gray-400">
            Memuat data registrasi dari database...
          </div>
        </div>

        <!-- Tombol Kembali -->
        <div class="flex justify-end pt-2">
          <a href="konten.html" class="bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition inline-flex items-center gap-1.5">
            ← Kembali
          </a>
        </div>

      </main>
    </div>
  </div>

  <!-- Area Tersembunyi untuk Format Cetak PDF Bukti Pengambilan Obat -->
  <div id="areaCetakPdf" style="display: none;"></div>

  <!-- Bottom Navigation Bar (Hanya tampil di Mobile/HP) -->
  <div class="bottom-nav-wrapper">
    <nav class="bg-[#d1e7dd] border border-blue-200 shadow-lg py-2.5 px-6 flex justify-around items-center rounded-t-2xl">
      <a href="index.html#registrasi" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/VYhY2ctH/Picsart-26-07-29-23-12-02-981.png" class="w-12 h-12 max-w-none object-contain scale-[1.0]">
        </div>
        <span class="text-[10px] mt-2 font-extrabold tracking-tight text-center">Registrasi</span>
      </a>
      <a href="maps.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/HLR5hhJ5/Picsart-26-07-29-23-13-36-887.png" class="w-12 h-12 max-w-none object-contain scale-[1.0]">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Maps</span>
      </a>
      <a href="tamu.html" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/F4SBD1L4/Picsart-26-07-30-01-19-44-361.png" class="w-12 h-12 max-w-none object-contain scale-[1.0]">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Tamu</span>
      </a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSexxMw_FdW-XT6yTyiPUVnpFyKf_j01-4lk-JmiQRrT3IC04A/viewform" target="_blank" class="flex flex-col items-center justify-center text-emerald-900 font-bold">
        <div class="w-7 h-7 flex items-center justify-center overflow-visible">
          <img src="https://i.ibb.co.com/yFDD7Dcb/Picsart-26-07-29-23-12-41-517.png" class="w-12 h-12 max-w-none object-contain scale-[1.0]">
        </div>
        <span class="text-[10px] mt-2 font-bold tracking-tight text-center">Survei</span>
      </a>
    </nav>
  </div>

  <!-- SKRIP FIREBASE & LOGIKA HALAMAN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    const q = query(collection(db, "tamu"), orderBy("waktu", "desc"));

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("containerTamu");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-xs text-gray-400">
            Belum ada riwayat registrasi yang tercatat di sistem.
          </div>
        `;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();

        let waktuStr = '-';
        if (item.waktu) {
          if (typeof item.waktu.toDate === 'function') {
            waktuStr = item.waktu.toDate().toLocaleString('id-ID');
          } else {
            waktuStr = item.waktu;
          }
        } else if (item.tanggal || item.createdAt) {
          waktuStr = item.tanggal || item.createdAt;
        }

        // Perhitungan durasi persis seperti di panel admin
        let durasi = "-"; 
        if (item.status === 'selesai' && item.waktuSelesai && item.waktuProses) {
          durasi = Math.round((item.waktuSelesai.toDate() - item.waktuProses.toDate()) / 60000) + " Menit";
        }

        let statusColor = "bg-amber-50 text-amber-800 border-amber-200";
        let statusText = item.status || item.statusPelayanan || "Selesai";
        const statusLower = String(statusText).toLowerCase();
        if (statusLower.includes("proses")) {
          statusColor = "bg-blue-50 text-blue-800 border-blue-200";
        } else if (statusLower.includes("selesai")) {
          statusColor = "bg-emerald-50 text-emerald-800 border-emerald-200";
        }

        let itemsObatArr = [];
        if (Array.isArray(item.itemsObat) && item.itemsObat.length > 0) {
          itemsObatArr = item.itemsObat;
        }

        const obatTerima = item.obatDiterima || item.daftarObat || item.obat || item.keteranganObat || '-';
        const namaPetugasVal = item.petugas || item.namaPetugas || item.petugasProgram || '-';
        const fileLink = item.suratUrl || item.fileUrl || item.fileLampiran || '';

        const normalizedData = {
          nama: item.nama || item.namaTamu || item.namaLengkap || 'Tanpa Nama',
          instansi: item.instansi || item.asal || item.instansiAsal || '-',
          keperluan: item.keperluan || item.tujuan || '-',
          petugas: namaPetugasVal,
          waktuFormatted: waktuStr,
          durasi: durasi,
          status: statusText,
          obatTerimaFormatted: obatTerima,
          itemsObat: itemsObatArr,
          nomorAntrian: item.nomorAntrian || item.noAntrian || '',
          fileUrl: fileLink
        };

        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-blue-400 space-y-3";
        
        let bagianObatHtml = '';
        if (normalizedData.itemsObat.length > 0) {
          let rowsHtml = '';
          normalizedData.itemsObat.forEach((ob, idx) => {
            rowsHtml += `
              <tr class="border-b text-[10px]">
                <td class="border p-1 text-center">${idx + 1}</td>
                <td class="border p-1 font-bold">${ob.nama || '-'}</td>
                <td class="border p-1 text-center">${ob.tahun || '-'}</td>
                <td class="border p-1 text-center">${ob.satuan || '-'}</td>
                <td class="border p-1 text-center">${ob.volume || '-'}</td>
                <td class="border p-1 text-center">${ob.ed || '-'}</td>
                <td class="border p-1 text-center font-mono">${ob.batch || '-'}</td>
              </tr>
            `;
          });
          bagianObatHtml = `
            <div class="border-t pt-2 space-y-1.5">
              <p class="text-[10px] text-blue-900 font-bold">Tabel Rincian Obat / Barang:</p>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-[10px] bg-white">
                  <thead>
                    <tr class="bg-gray-100 text-center font-bold text-[9px] uppercase">
                      <th class="border p-1 w-6">No</th>
                      <th class="border p-1">Nama Barang</th>
                      <th class="border p-1 w-12">Tahun</th>
                      <th class="border p-1 w-12">Satuan</th>
                      <th class="border p-1 w-10">Vol</th>
                      <th class="border p-1 w-12">Ed</th>
                      <th class="border p-1 w-16">No Batch</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          bagianObatHtml = `
            <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100 text-[10px] space-y-1">
              <p class="text-blue-900 font-bold">Obat yang Diterima:</p>
              <p class="text-gray-700 whitespace-pre-line">${normalizedData.obatTerimaFormatted}</p>
            </div>
          `;
        }

        let fileLampiranHtml = '';
        if (fileLink && fileLink.length > 0) {
          fileLampiranHtml = `
            <div class="pt-1">
              <a href="${fileLink}" download="Surat_Permintaan_${normalizedData.nama}" target="_blank" class="inline-block bg-blue-100 text-blue-800 px-2.5 py-1 rounded text-[10px] font-bold hover:bg-blue-200 transition">📥 Lihat/Unduh File Lampiran</a>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="space-y-0.5">
              <h3 class="font-extrabold text-xs text-blue-900">${normalizedData.nama}</h3>
              <p class="text-[10px] text-gray-600"><b>Instansi:</b> ${normalizedData.instansi}</p>
              <p class="text-[10px] text-gray-600"><b>Keperluan:</b> ${normalizedData.keperluan}</p>
              <p class="text-[10px] text-gray-600"><b>Petugas:</b> ${normalizedData.petugas}</p>
              <p class="text-[10px] text-gray-600"><b>Durasi:</b> ${normalizedData.durasi}</p>
              ${normalizedData.nomorAntrian ? `<p class="text-[10px] text-blue-700 font-bold">No. Antrian: ${normalizedData.nomorAntrian}</p>` : ''}
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border shrink-0 ${statusColor}">
              ${normalizedData.status}
            </span>
          </div>

          ${fileLampiranHtml}
          ${bagianObatHtml}

          <div class="border-t pt-2 flex justify-between items-center text-[10px] text-gray-500">
            <span><b>Waktu:</b> ${normalizedData.waktuFormatted}</span>
            <button onclick='downloadPdf(${JSON.stringify(normalizedData)})' class="bg-blue-900 hover:bg-blue-800 text-white px-3 py-1.5 rounded-xl font-bold transition shadow-sm inline-flex items-center gap-1">
              Download PDF 📥
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      console.error("Gagal memuat data tamu:", error);
      document.getElementById("containerTamu").innerHTML = `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-400 text-center text-xs text-red-400">
          Gagal memuat data dari database.
        </div>
      `;
    });

    window.downloadPdf = (data) => {
      const areaCetak = document.getElementById("areaCetakPdf");
      areaCetak.style.display = "block";

      const items = (data.itemsObat && data.itemsObat.length > 0) ? data.itemsObat : [];

      let rowsHtml = '';
      if (items.length > 0) {
        rowsHtml = items.map((item, i) => `
          <tr>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px; height: 18px;">${i + 1}</td>
            <td style="border: 1px solid #000; padding: 5px; font-size: 9px; font-weight: bold;">${item.nama || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px;">${item.tahun || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px;">${item.satuan || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px;">${item.volume || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px;">${item.ed || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px; font-family: monospace;">${item.batch || '-'}</td>
            <td style="border: 1px solid #000; text-align: center; padding: 5px; font-size: 9px;"></td>
          </tr>
        `).join('');
      } else {
        rowsHtml = `
          <tr>
            <td style="border: 1px solid #000; text-align: center; padding: 6px; font-size: 9px;">1</td>
            <td style="border: 1px solid #000; padding: 6px; font-size: 9px; text-align: center; font-style: italic;" colspan="7">Belum ada rincian barang/obat yang dimasukkan.</td>
          </tr>
        `;
      }

      areaCetak.innerHTML = `
        <div style="padding: 15px 20px; font-family: Arial, sans-serif; color: #000; width: 100%; background: #fff; box-sizing: border-box;">
          
          <table style="width: 100%; border-collapse: collapse; border-bottom: 3.5px double #000; padding-bottom: 8px; margin-bottom: 12px;">
            <tr>
              <td style="width: 85px; vertical-align: middle; text-align: left; padding-left: 5px;">
                <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" style="width: 100px; height: auto;" crossorigin="anonymous">
              </td>
              <td style="text-align: center; vertical-align: middle; padding-right: 35px;">
                <h2 style="font-size: 22px; margin: 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">PEMERINTAH KOTA TANGERANG SELATAN</h2>
                <h1 style="font-size: 22px; margin: 2px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">DINAS KESEHATAN</h1>
                <h1 style="font-size: 22px; margin: 2px 0; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">UPTD FARMASI</h1>
                <p style="font-size: 12px; margin: 3px 0 1px 0;">Jl. Cendekia BSD Sektor XI Ciater Serpong, Kota Tangerang Selatan - Banten</p>
                <p style="font-size: 9px; margin: 0; color: #000;">pos-el <span style="color: #0000ff; text-decoration: underline;">uptdfarmasi@tangerangselatankota.go.id</span></p>
              </td>
            </tr>
          </table>

          <div style="text-align: center; margin-bottom: 12px;">
            <div style="font-size: 11.5px; font-weight: bold; text-decoration: underline; display: inline-block; padding-bottom: 1px;">BUKTI PENGAMBILAN OBAT/PELAYANAN</div>
          </div>

          <table style="width: 100%; font-size: 9.5px; margin-bottom: 12px; border-collapse: collapse;">
            <tr>
              <td style="width: 120px; font-weight: bold;">Nama</td>
              <td style="width: 10px;">:</td>
              <td style="font-weight: bold; text-transform: uppercase;">${data.nama || '-'}</td>
              <td style="width: 110px; font-weight: bold;">No Antrian</td>
              <td style="width: 10px; text-align: center;">:</td>
              <td style="font-weight: bold;">${data.nomorAntrian || '-'}</td>
            </tr>
            <tr>
              <td style="font-weight: bold;">Instansi</td>
              <td>:</td>
              <td style="text-transform: uppercase;">${data.instansi || '-'}</td>
              <td style="font-weight: bold;">Status Pelayanan</td>
              <td style="text-align: center;">:</td>
              <td style="font-weight: bold; text-transform: uppercase;">${data.status || '-'}</td>
            </tr>
            <tr>
              <td style="font-weight: bold;">Keperluan</td>
              <td>:</td>
              <td>${data.keperluan || '-'}</td>
              <td style="font-weight: bold;">Durasi</td>
              <td style="text-align: center;">:</td>
              <td>${data.durasi || '-'}</td>
            </tr>
            <tr>
              <td style="font-weight: bold;">Petugas Program</td>
              <td>:</td>
              <td>${data.petugas || '-'}</td>
              <td style="font-weight: bold;">Waktu Kunjungan</td>
              <td style="text-align: center;">:</td>
              <td>${data.waktuFormatted || '-'}</td>
            </tr>
            <tr>
              <td style="font-weight: bold;">Lampiran File</td>
              <td>:</td>
              <td colspan="4" style="color: #0000ff;">${data.fileUrl ? 'File Lampiran Tersedia' : 'Tidak ada file dilampirkan'}</td>
            </tr>
          </table>

          <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px;">
            <thead>
              <tr style="background-color: #f3f4f6; text-align: center; font-size: 9px; font-weight: bold;">
                <th style="border: 1px solid #000; padding: 5px; width: 30px;">No</th>
                <th style="border: 1px solid #000; padding: 5px;">Nama Barang</th>
                <th style="border: 1px solid #000; padding: 5px; width: 65px;">Tahun</th>
                <th style="border: 1px solid #000; padding: 5px; width: 65px;">Satuan</th>
                <th style="border: 1px solid #000; padding: 5px; width: 55px;">Volume</th>
                <th style="border: 1px solid #000; padding: 5px; width: 60px;">Ed</th>
                <th style="border: 1px solid #000; padding: 5px; width: 75px;">No Batch</th>
                <th style="border: 1px solid #000; padding: 5px; width: 50px;">Paraf</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>

          <table style="width: 100%; margin-top: 20px; font-size: 9.5px; border-collapse: collapse;">
            <tr>
              <td style="width: 50%; text-align: center; vertical-align: top;">
                <p style="margin: 0; font-weight: bold;">Petugas</p>
                <br><br><br>
                <p style="margin: 0; font-weight: bold; text-decoration: underline;">${data.petugas && data.petugas !== '-' ? data.petugas : '......................................'}</p>
              </td>
              <td style="width: 50%; text-align: center; vertical-align: top;">
                <p style="margin: 0; font-weight: bold;">Penerima</p>
                <br><br><br>
                <p style="margin: 0; font-weight: bold; text-decoration: underline;">${data.nama || '......................................'}</p>
              </td>
            </tr>
          </table>

        </div>
      `;

      setTimeout(() => {
        const opt = {
          margin:       [5, 5, 5, 5],
          filename:     `Bukti_Pengambilan_Obat_${data.nama || 'Tamu'}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, letterRendering: true, scrollX: 0, scrollY: 0 },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(areaCetak).set(opt).save().then(() => {
          areaCetak.style.display = "none";
          areaCetak.innerHTML = "";
        });
      }, 300);
    };
  </script>
</body>
</html>
