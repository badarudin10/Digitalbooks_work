<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>PROFIL PEGAWAI UPTD FARMASI</title>
</head>
<body class="bg-[#d1e7dd] min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header / Navigasi Sederhana -->
    <div class="bg-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-blue-900">PROFIL PEGAWAI UPTD FARMASI</h1>
        <p class="text-xs text-gray-500 mt-1">Daftar Pegawai dan Penanggung Jawab Program</p>
      </div>
      <a href="index.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-300">Kembali ke Beranda</a>
    </div>

    <!-- Container Daftar Pegawai (Layout Horizontal) -->
    <div id="containerProfilPegawai" class="space-y-4">
      <!-- Data pegawai akan dimuat otomatis secara real-time dari Firestore -->
      <div class="bg-white p-6 rounded-2xl shadow-lg text-center text-gray-500">Memuat data pegawai...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app", messagingSenderId: "905407530155", appId: "1:905407530155:web:dd90e18d4158ce42fae3ee", measurementId: "G-LL7GF2RMF8" };
    const db = getFirestore(initializeApp(firebaseConfig));

    // Menampilkan profil pegawai secara real-time dari koleksi "pegawai" dengan layout horizontal
    onSnapshot(query(collection(db, "pegawai"), orderBy("waktuInput", "desc")), (snap) => {
      const container = document.getElementById("containerProfilPegawai");
      container.innerHTML = "";

      if (snap.empty) {
        container.innerHTML = `<div class="bg-white p-8 rounded-2xl shadow text-center text-gray-500">Belum ada data pegawai yang ditambahkan oleh admin.</div>`;
        return;
      }

      snap.forEach(d => {
        const item = d.data();
        const fotoUrl = item.url ? item.url : "https://via.placeholder.com/150?text=No+Photo";
        
        container.innerHTML += `
          <div class="bg-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row items-center gap-6">
            <!-- Foto di Kiri -->
            <div class="w-32 h-32 md:w-36 md:h-36 shrink-0 rounded-2xl overflow-hidden border-2 border-blue-900 shadow-md bg-gray-100">
              <img src="${fotoUrl}" alt="Foto Pegawai" class="w-full h-full object-cover">
            </div>
            <!-- Data di Kanan -->
            <div class="flex-1 w-full text-center md:text-left space-y-2">
              <div>
                <h3 class="font-bold text-xl text-blue-900">${item.nama}</h3>
                <p class="text-sm text-gray-600 font-semibold">${item.jabatan}</p>
              </div>
              <div class="border-t pt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-gray-700 bg-gray-50 p-3 rounded-xl">
                <p><b>Golongan:</b> ${item.golongan || '-'}</p>
                <p><b>PJ Program:</b> ${item.pj || '-'}</p>
              </div>
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
