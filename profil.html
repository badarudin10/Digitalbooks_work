<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Profil Pegawai - UPTD Farmasi</title>
</head>
<body class="bg-[#d1e7dd] min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header / Navigasi Sederhana -->
    <div class="bg-white p-6 rounded-2xl shadow-lg flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-blue-900">Profil & Data Pegawai</h1>
        <p class="text-xs text-gray-500 mt-1">UPTD Farmasi - Daftar Pegawai dan Penanggung Jawab Program</p>
      </div>
      <a href="index.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-300">Kembali ke Beranda</a>
    </div>

    <!-- Grid Daftar Pegawai -->
    <div id="containerProfilPegawai" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Data pegawai akan dimuat otomatis secara real-time dari Firestore -->
      <div class="col-span-full text-center py-10 text-gray-500">Memuat data pegawai...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app", messagingSenderId: "905407530155", appId: "1:905407530155:web:dd90e18d4158ce42fae3ee", measurementId: "G-LL7GF2RMF8" };
    const db = getFirestore(initializeApp(firebaseConfig));

    // Menampilkan profil pegawai secara real-time dari koleksi "pegawai"
    onSnapshot(query(collection(db, "pegawai"), orderBy("waktuInput", "desc")), (snap) => {
      const container = document.getElementById("containerProfilPegawai");
      container.innerHTML = "";

      if (snap.empty) {
        container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-2xl shadow text-center text-gray-500">Belum ada data pegawai yang ditambahkan oleh admin.</div>`;
        return;
      }

      snap.forEach(d => {
        const item = d.data();
        const fotoUrl = item.url ? item.url : "https://via.placeholder.com/150?text=No+Photo";
        
        container.innerHTML += `
          <div class="bg-white p-6 rounded-2xl shadow-lg flex flex-col items-center text-center space-y-3">
            <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-blue-900 shadow-md">
              <img src="${fotoUrl}" alt="Foto Pegawai" class="w-full h-full object-cover">
            </div>
            <div>
              <h3 class="font-bold text-lg text-blue-900">${item.nama}</h3>
              <p class="text-xs text-gray-600 font-semibold mt-0.5">${item.jabatan}</p>
            </div>
            <div class="w-full border-t pt-3 text-left text-xs space-y-1 text-gray-700 bg-gray-50 p-3 rounded-lg">
              <p><b>Golongan:</b> ${item.golongan || '-'}</p>
              <p><b>PJ Program:</b> ${item.pj || '-'}</p>
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
