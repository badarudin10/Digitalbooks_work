<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none !important; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block !important; }
    body { overflow-x: hidden; width: 100%; position: relative; }
    img, video { max-width: 100%; height: auto; }
  </style>
  <title>Konsultasi & Pengaduan - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#d1e7dd] font-sans min-h-screen pb-10">
  
  <header class="bg-[#d1e7dd] px-4 py-3 shadow-sm sticky top-0 z-30 border border-blue-200">
    <!-- Diubah ke max-w-4xl agar melebar di PC -->
    <div class="w-full max-w-7xl mx-auto px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-10 w-10 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm tracking-wide leading-tight">UPTD FARMASI</h1>
          <p class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Diubah ke max-w-4xl agar card dan form ikut melebar di layar PC/Desktop -->
  <main class="w-full max-w-7xl mx-auto p-4 md:p-6 space-y-4">
    
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-400 flex items-center gap-4">
      <div class="w-20 h-20 flex items-center justify-center flex-shrink-0 bg-blue-50 rounded-2xl p-2 border border-blue-400 overflow-hidden">
        <img src="https://i.ibb.co.com/4nWYJqhW/Picsart-26-07-27-12-54-41-199.png" class="w-full h-full object-contain transform scale-150">
      </div>
      <div>
        <h2 class="text-sm font-extrabold text-blue-900 uppercase">Layanan Konsultasi & Pengaduan</h2>
        <p class="text-[11px] text-gray-600 mt-0.5">Sampaikan pertanyaan teknis, kendala layanan, atau masukan Anda. Data tercatat di sistem dan otomatis terkirim via WhatsApp penanggung jawab.</p>
      </div>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-blue-400">
      <form id="formKonsultasi" class="space-y-3">
        <!-- Input Nama Lengkap -->
        <div>
          <label class="block text-xs font-extrabold text-gray-700 mb-1">Nama Lengkap</label>
          <input type="text" id="namaPengirim" required placeholder="Masukkan nama lengkap..." class="w-full px-3 py-2 text-xs border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
        </div>
        <!-- Input Instansi -->
        <div>
          <label class="block text-xs font-extrabold text-gray-700 mb-1">Asal Instansi / Unit Kerja</label>
          <input type="text" id="instansiPengirim" required placeholder="Masukkan asal instansi / Puskesmas / RS / Unit..." class="w-full px-3 py-2 text-xs border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
        </div>
        <!-- Input Kontak -->
        <div>
          <label class="block text-xs font-extrabold text-gray-700 mb-1">Nomor WhatsApp / Kontak</label>
          <input type="tel" id="kontakPengirim" required placeholder="Contoh: 081234567890" class="w-full px-3 py-2 text-xs border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
        </div>

        <!-- KATEGORI KELUHAN MENGGUNAKAN DROPDOWN (MUNCUL PILIHAN KETIKA DIKLIK) -->
        <div>
          <label class="block text-xs font-extrabold text-gray-700 mb-1">Pilih Keperluan</label>
          <select id="kategoriKonsultasi" required class="w-full px-3 py-2 text-xs border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 font-bold text-gray-700">
            <option value="" disabled selected>Pilih Keperluan:</option>
            <option value="A. OBAT PKD">A. OBAT PKD</option>
            <option value="B. VAKSIN">B. VAKSIN</option>
            <option value="C. REAGEN">C. REAGEN</option>
            <option value="D. TB dan KUSTA">D. TB dan KUSTA</option>
            <option value="E. HIV dan PKG">E. HIV dan PKG</option>
            <option value="F. DBD dan MALARIA">F. DBD dan MALARIA</option>
            <option value="G. HEPATITIS_VAKSIN_PROGRAM">G. HEPATITIS_VAKSIN_PROGRAM</option>
            <option value="Lain-lain">Lain-lain</option>
          </select>
        </div>

        <!-- Isi Konsultasi -->
        <div>
          <label class="block text-xs font-extrabold text-gray-700 mb-1">Isi Konsultasi / Keluhan</label>
          <textarea id="isiKonsultasi" rows="4" required placeholder="Tuliskan detail pertanyaan atau keluhan Anda secara jelas..." class="w-full px-3 py-2 text-xs border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"></textarea>
        </div>

        <button type="submit" id="btnKirim" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-extrabold py-2.5 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
          <span>Kirim Konsultasi & Keluhan via WhatsApp</span>
          <span>→</span>
        </button>
      </form>
    </div>

    <div class="flex justify-end">
      <a href="konten.html" class="bg-blue-900 hover:bg-blue-800 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs transition shadow-md inline-flex items-center justify-center gap-2">
        <span>← Kembali</span>
      </a>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    
    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app" };
    const db = getFirestore(initializeApp(firebaseConfig));

    const NOMOR_WA_ADMIN = "6285716842806"; 

    const form = document.getElementById('formKonsultasi');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnKirim');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const nama = document.getElementById('namaPengirim').value;
      const instansi = document.getElementById('instansiPengirim').value;
      const kontak = document.getElementById('kontakPengirim').value;
      const kategori = document.getElementById('kategoriKonsultasi').value;
      const isi = document.getElementById('isiKonsultasi').value;

      try {
        await addDoc(collection(db, "konsultasi"), {
          nama: nama,
          instansi: instansi,
          kontak: kontak,
          kategori: kategori,
          isi: isi,
          waktuInput: serverTimestamp()
        });

        const pesanWA = `Halo Admin / Penanggung Jawab UPTD Farmasi Tangsel,%0A%0ASaya ingin menyampaikan konsultasi / keluhan baru:%0A%0A*Nama:* ${encodeURIComponent(nama)}%0A*Instansi:* ${encodeURIComponent(instansi)}%0A*No. WhatsApp:* ${encodeURIComponent(kontak)}%0A*Kategori:* ${encodeURIComponent(kategori)}%0A*Isi Keluhan:*%0A${encodeURIComponent(isi)}%0A%0ATerima kasih.`;

        window.open(`https://wa.me/${NOMOR_WA_ADMIN}?text=${pesanWA}`, '_blank');

        alert("Konsultasi berhasil disimpan ke sistem dan WhatsApp penanggung jawab akan segera dibuka.");
        form.reset();
      } catch (err) {
        console.error("Gagal mengirim:", err);
        alert("Gagal mengirim konsultasi. Silakan coba lagi.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Kirim Konsultasi & Keluhan via WhatsApp</span> <span>→</span>`;
      }
    });
  </script>
</body>
</html>
