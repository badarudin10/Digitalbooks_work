<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-custom { opacity: 0; visibility: hidden; pointer-events: none; display: none !important; }
    .visible-custom { opacity: 1; visibility: visible; pointer-events: auto; display: block !important; }
    
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    
    img, video {
      max-width: 100%;
      height: auto;
    }
  </style>
  <title>Konsultasi & Pengaduan - UPTD Farmasi Tangsel</title>
</head>
<body class="bg-[#e3ede6] font-sans min-h-screen pb-10">
  
  <!-- Header Atas -->
  <header class="bg-[#e3ede6] px-4 py-3 shadow-sm sticky top-0 z-30 border-b border-emerald-200">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://i.ibb.co.com/ksp2gP0q/Lambang-Kota-Tangerang-Selatan-1.png" alt="Logo" class="h-10 w-10 object-contain">
        <div>
          <h1 class="font-extrabold text-blue-900 text-sm tracking-wide leading-tight">UPTD FARMASI</h1>
          <p class="text-[10px] text-gray-600 font-semibold uppercase tracking-wider">Kota Tangerang Selatan</p>
        </div>
      </div>
      <a href="index.html" class="text-xs font-bold text-blue-900 bg-white px-3 py-1.5 rounded-xl border border-emerald-200 shadow-sm hover:bg-emerald-50 transition">← Dashboard</a>
    </div>
  </header>

  <!-- Konten Utama Konsultasi -->
  <main class="max-w-2xl mx-auto p-4 space-y-4">
    
    <!-- Kartu Informasi / Header Halaman -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
      <div class="w-16 h-16 flex items-center justify-center flex-shrink-0 bg-blue-50 rounded-2xl p-2 border border-blue-100">
        <img src="https://i.ibb.co.com/4nWYJqhW/Picsart-26-07-27-12-54-41-199.png" class="w-full h-full object-contain">
      </div>
      <div>
        <h2 class="text-sm font-extrabold text-blue-900 uppercase">Layanan Konsultasi & Pengaduan</h2>
        <p class="text-[11px] text-gray-600 mt-0.5">Informasi seputar layanan konsultasi teknis, kendala, dan pengaduan pada UPTD Farmasi Kota Tangerang Selatan.</p>
      </div>
    </div>

  </main>

</body>
</html>
