<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Konsultasi & Pengaduan - UPTD Farmasi</title>
</head>
<body class="bg-[#d1e7dd] min-h-screen p-4 flex items-center justify-center">

  <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-lg">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-blue-900">Form Konsultasi & Pengaduan</h2>
      <p class="text-xs text-gray-600 mt-1">UPTD Farmasi Kota Tangerang Selatan</p>
    </div>

    <form id="formKonsultasi" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan nama Anda..." class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-900 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Instansi / Puskesmas / Rumah Sakit</label>
        <input type="text" id="instansi" required placeholder="Masukkan nama instansi..." class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-900 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nomor Kontak / WhatsApp</label>
        <input type="tel" id="kontak" required placeholder="Contoh: 08123456789" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-900 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Pilih Keperluan / Kategori Keluhan:</label>
        <div class="space-y-2 border p-3 rounded-lg bg-gray-50 max-h-56 overflow-y-auto">
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="A. OBAT PKD" required class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">A. OBAT PKD</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="B. VAKSIN" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">B. VAKSIN</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="C. REAGEN" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">C. REAGEN</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="D. TB dan KUSTA" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">D. TB dan KUSTA</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="E. HIV dan PKG" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">E. HIV dan PKG</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="F. DBD dan MALARIA" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">F. DBD dan MALARIA</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="G. HEPATITIS VAKSIN PROGRAM" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">G. HEPATITIS VAKSIN PROGRAM</span>
          </label>
          <label class="flex items-center space-x-3 p-2 bg-white rounded border cursor-pointer hover:bg-blue-50">
            <input type="radio" name="kategori" value="Lain-lain" class="w-4 h-4 text-blue-900">
            <span class="text-xs font-bold text-gray-800">Lain-lain</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Isi Konsultasi / Keluhan</label>
        <textarea id="isi" rows="4" required placeholder="Tuliskan detail keluhan atau pertanyaan Anda..." class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-900 outline-none"></textarea>
      </div>

      <button type="submit" id="btnKirim" class="w-full bg-blue-900 text-white p-3 rounded-lg font-bold hover:bg-blue-800 transition">Kirim Konsultasi</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyA6B5MysWIMi4weR3Wgo3HuaIl-aaZpChw", authDomain: "digital-books-d22c9.firebaseapp.com", projectId: "digital-books-d22c9", storageBucket: "digital-books-d22c9.firebasestorage.app", messagingSenderId: "905407530155", appId: "1:905407530155:web:dd90e18d4158ce42fae3ee", measurementId: "G-LL7GF2RMF8" };
    const db = getFirestore(initializeApp(firebaseConfig));

    document.getElementById("formKonsultasi").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnKirim");
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      const nama = document.getElementById("nama").value.trim();
      const instansi = document.getElementById("instansi").value.trim();
      const kontak = document.getElementById("kontak").value.trim();
      
      const selectedKategori = document.querySelector('input[name="kategori"]:checked');
      const kategori = selectedKategori ? selectedKategori.value : "-";
      
      const isi = document.getElementById("isi").value.trim();

      try {
        await addDoc(collection(db, "konsultasi"), {
          nama,
          instansi,
          kontak,
          kategori,
          isi,
          waktuInput: serverTimestamp()
        });
        alert("Konsultasi atau keluhan berhasil dikirim!");
        document.getElementById("formKonsultasi").reset();
      } catch (err) {
        console.error(err);
        alert("Gagal mengirim data. Silakan coba lagi.");
      } finally {
        btn.innerText = "Kirim Konsultasi";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
